# Trivy ignore file — TIME-BOXED EXCEPTIONS ONLY.
#
# Every entry here MUST carry an `expired_at`. Once that date passes Trivy stops
# honouring the entry and the release gate goes red again, by design: an
# exception that cannot expire is a permanent downgrade wearing a different hat.
#
# RULES (founder decision, 2026-08-13):
#   - Specific CVE/GHSA ids only. Never a whole package, never a severity.
#   - No crypto findings may ever be excepted here. Anything touching
#     crypto/tls, certificate validation, signing or key handling is
#     categorically non-exceptable and must be fixed.
#   - Each entry states WHY it cannot be fixed today and what unblocks it.
#
# Everything else from the 2026-08 remediation was fixed properly, not excepted:
#   - npm removed from the runtime stage (7 findings, incl. CRITICAL tar)
#   - @lingui/vite-plugin moved to devDependencies, dropping @lingui/cli and its
#     esbuild 0.21.5 / Go 1.20.12 copy from the production closure (18 findings)
#   - esbuild pinned to 0.28.2, which carries a patched Go toolchain (15 -> 0)
#   - brace-expansion / @xmldom/xmldom / postcss / nanoid / ip-address /
#     fast-xml-* / js-yaml / form-data / multer / tmp / @babel/* bumped
#
# The two below are the ONLY findings not fixed in that pass. Both are major
# version bumps on live auth/mail-adjacent paths that need a dedicated test
# cycle rather than a release-blocking rush. Neither is a crypto finding.

vulnerabilities:
  # ---------------------------------------------------------------------------
  # nodemailer 8.0.4 -> 9.0.1 (MAJOR). nodemailer is pinned deliberately at
  # 8.0.4 by a root `resolutions` entry AND declared `^8.0.4` in
  # packages/twenty-server/package.json, on the live outbound mail path.
  # CANNOT LAND YET: the fix needs both pins bumped AND a regenerated root
  # yarn.lock (1.96 MB, yarn 4). CI runs `yarn install --immutable` in 5
  # lanes, so a package.json bump without a matching regenerated lockfile
  # fails the gate — and the lockfile can only be regenerated by
  # `yarn install` in a real checkout. The current environment is
  # gh-API-only (no checkout) and cannot run yarn install or the mail-flow
  # test cycle (invite / password-reset / verification sends) that gates the
  # pin override. Upgrade risk is LOW: the API surface used (see
  # smtp.driver.ts) is createTransport, sendMail, and the
  # SendMailOptions/Transporter/SMTPConnection.Options types, all stable
  # across the 8->9 major — but the mail-flow cycle must still confirm it.
  # Expiry extended 2026-09-15 -> 2026-11-15 as a scheduling accommodation
  # pending a checkout-based upgrade, NOT a permanent downgrade.
  # Unblocked by: checkout-based upgrade (bump pins + regenerate yarn.lock)
  # followed by the dedicated mail-flow test cycle.
  # ---------------------------------------------------------------------------
  - id: GHSA-p6gq-j5cr-w38f
    statement: >-
      nodemailer 8.0.4 -> 9.0.1 major bump on the live outbound mail path,
      blocked by a root resolutions pin and a ^8.0.4 declaration in
      packages/twenty-server/package.json. Landing it requires bumping both
      pins and regenerating the 1.96 MB root yarn.lock via yarn 4 install in
      a real checkout: CI's `yarn install --immutable` (5 lanes) fails on a
      package.json bump without a matching lockfile, and this environment is
      gh-API-only with no checkout. Expected low-risk — the used API surface
      (createTransport, sendMail, SendMailOptions/Transporter/
      SMTPConnection.Options in smtp.driver.ts) is stable across the major —
      but the mail-flow test cycle (invite / password-reset / verification
      sends) must confirm before the pin is lifted. Time-boxed to 2026-11-15;
      scheduling accommodation, not a permanent downgrade.
    expired_at: 2026-11-15

