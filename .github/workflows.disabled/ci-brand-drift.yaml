name: Brand drift check

# Fails when a PR introduces the literal string "twenty" (case-insensitive)
# into source files outside the allowlist. Only ADDED lines in the PR diff
# are scanned — pre-existing occurrences never trigger this check.
#
# Allowlisted paths live in .brand-drift-allowlist.txt at the repo root.
# Update that file (with a comment explaining why) when a new legal/required
# occurrence needs to land.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  brand-drift:
    name: Detect "twenty" leaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect "twenty" in PR-added lines outside allowlist
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOWLIST_FILE: .brand-drift-allowlist.txt
          # Paths scanned for the brand string. Match the spec in UPSTREAM.md.
          SCAN_PATHS: 'packages/ README.md NOTICE'
        run: |
          set -euo pipefail

          if [ ! -f "${ALLOWLIST_FILE}" ]; then
            echo "::error::Missing ${ALLOWLIST_FILE} at repo root."
            exit 1
          fi

          # Parse allowlist (strip comments + blanks).
          mapfile -t ALLOWED < <(grep -vE '^\s*(#|$)' "${ALLOWLIST_FILE}" || true)

          is_allowed() {
            local candidate="$1"
            for entry in "${ALLOWED[@]}"; do
              if [ "${candidate}" = "${entry}" ]; then
                return 0
              fi
            done
            return 1
          }

          # List PR-changed files (added/modified) intersected with SCAN_PATHS.
          # We use the merge-base to avoid double-counting commits already on main.
          MERGE_BASE=$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")

          # Build the path-scope filter for git diff.
          # shellcheck disable=SC2086
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM \
            "${MERGE_BASE}" "${HEAD_SHA}" -- ${SCAN_PATHS} || true)

          if [ -z "${CHANGED_FILES}" ]; then
            echo "No files in scope (${SCAN_PATHS}) changed in this PR."
            exit 0
          fi

          violations=0
          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            if is_allowed "${file}"; then
              echo "skip (allowlisted): ${file}"
              continue
            fi

            # Extract added lines for this file from the PR diff.
            # 'git diff -U0' suppresses context; '^+' (not '^+++') = added line.
            added=$(git diff -U0 "${MERGE_BASE}" "${HEAD_SHA}" -- "${file}" \
              | grep -E '^\+[^+]' || true)

            if [ -z "${added}" ]; then
              continue
            fi

            if echo "${added}" | grep -iqE 'twenty'; then
              echo "::error file=${file}::Brand drift: PR adds 'twenty' to ${file}. Either rename or add ${file} to ${ALLOWLIST_FILE} with a justification comment."
              echo "  Offending added lines:"
              echo "${added}" | grep -iE 'twenty' | sed 's/^/    /'
              violations=$((violations + 1))
            fi
          done <<< "${CHANGED_FILES}"

          if [ "${violations}" -gt 0 ]; then
            echo "::error::${violations} file(s) introduced 'twenty' outside the brand-drift allowlist."
            exit 1
          fi

          echo "Brand drift check passed — no 'twenty' leaks in PR-added lines."
