# Health check monitor for crm.askexe.com.
#
# DISABLED by default (workflow_dispatch only). Enable the schedule trigger
# once crm.askexe.com is live by uncommenting the cron line below.

name: Health check

on:
  workflow_dispatch:
  # Uncomment when crm.askexe.com is live:
  # schedule:
  #   - cron: '0 */6 * * *'  # every 6 hours

permissions:
  contents: read

jobs:
  health:
    name: Check /healthz
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Curl health endpoint
        run: |
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' \
            --max-time 30 --retry 2 --retry-delay 5 \
            https://crm.askexe.com/healthz || true)
          echo "Health check status: ${STATUS}"
          if [ "${STATUS}" != "200" ]; then
            echo "::error::Health check failed with status ${STATUS}"
            exit 1
          fi
          echo "Health check passed."
