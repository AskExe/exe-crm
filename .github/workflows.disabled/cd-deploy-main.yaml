# Build and push Docker images to GHCR on push to main.
#
# Image: ghcr.io/askexe/exe-crm:v{version}, :latest
#
# Builds the unified "twenty" target (server + frontend static files) from
# packages/twenty-docker/twenty/Dockerfile and pushes to GHCR.
# Version extracted from package.json. Multi-platform: linux/amd64 + linux/arm64.
#
# SSH deploy to VPS is DEFERRED — this workflow only builds and pushes images.

name: Docker Build & Push

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.vscode/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build
  cancel-in-progress: true

jobs:
  version:
    name: Extract version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & push to GHCR
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/askexe/exe-crm
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=exe-crm
          cache-to: type=gha,mode=max,scope=exe-crm
