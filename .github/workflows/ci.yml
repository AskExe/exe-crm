name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON('["self-hosted", "macOS", "ARM64", "mac-fast"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build shared
        run: npx nx build twenty-shared

      - name: Build oxlint plugin
        run: npx nx build twenty-oxlint-rules

      - name: Typecheck frontend
        run: npx nx typecheck twenty-front

      - name: Typecheck server
        run: npx nx typecheck twenty-server

      - name: Lint frontend
        run: npx nx lint twenty-front

      - name: Lint server (oxlint)
        # oxlint has an intermittent thread panic on large codebases — treat as warning
        run: cd packages/twenty-server && npx oxlint --type-aware -c .oxlintrc.json src/ || echo "::warning::oxlint exited non-zero (possible thread panic — known issue)"
        continue-on-error: true

      - name: Lint server (prettier)
        run: cd packages/twenty-server && npx prettier src/ --check

  brand-drift:
    name: Brand drift check
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    # The scan itself takes ~2s, but `timeout-minutes` covers the WHOLE job —
    # including the self-hosted runner's `ci-slot-acquire.sh` job-started hook,
    # which blocks in "Set up runner" until a slot frees on the shared x64 box.
    # At 5 minutes that budget was smaller than the queue wait, so under load
    # the job burned its entire allowance waiting and GitHub cancelled it with
    # Checkout and the detect step still SKIPPED — a required check reporting
    # failure without ever having run (observed: 6m32s in slot-acquire on PR
    # #100, both real steps skipped). 20 leaves the slot wait ample room; the
    # step itself is ~2s of git diff and cannot get slower.
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect "twenty" in PR-added lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOWLIST_FILE: .brand-drift-allowlist.txt
          SCAN_PATHS: 'packages/ README.md NOTICE'
        run: |
          set -euo pipefail

          if [ ! -f "${ALLOWLIST_FILE}" ]; then
            echo "::error::Missing ${ALLOWLIST_FILE} at repo root."
            exit 1
          fi

          mapfile -t ALLOWED < <(grep -vE '^\s*(#|$)' "${ALLOWLIST_FILE}" || true)

          is_allowed() {
            local candidate="$1"
            for entry in "${ALLOWED[@]}"; do
              if [ "${candidate}" = "${entry}" ]; then
                return 0
              fi
            done
            return 1
          }

          MERGE_BASE=$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")
          # shellcheck disable=SC2086
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM \
            "${MERGE_BASE}" "${HEAD_SHA}" -- ${SCAN_PATHS} || true)

          if [ -z "${CHANGED_FILES}" ]; then
            echo "No files in scope changed in this PR."
            exit 0
          fi

          violations=0
          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            if is_allowed "${file}"; then
              echo "skip (allowlisted): ${file}"
              continue
            fi

            added=$(git diff -U0 "${MERGE_BASE}" "${HEAD_SHA}" -- "${file}" \
              | grep -E '^\+[^+]' || true)

            if [ -z "${added}" ]; then
              continue
            fi

            # Exclude package imports (twenty-shared, twenty-ui, etc.) — those are legitimate
            filtered=$(echo "${added}" | grep -ivE "from ['\"]twenty-|require\(['\"]twenty-" || true)
            if [ -n "${filtered}" ] && echo "${filtered}" | grep -iqE 'twenty'; then
              echo "::error file=${file}::Brand drift: PR adds 'twenty' to ${file}."
              echo "${added}" | grep -iE 'twenty' | sed 's/^/    /'
              violations=$((violations + 1))
            fi
          done <<< "${CHANGED_FILES}"

          if [ "${violations}" -gt 0 ]; then
            echo "::error::${violations} file(s) introduced 'twenty' outside the brand-drift allowlist."
            exit 1
          fi

          echo "Brand drift check passed."

  # MAIN LANE — full Linux server test coverage, unchanged, but now runs ONLY
  # on push to main. PRs and the merge queue get the same suite on the mac
  # runner via `server-tests-mac` below (the PR-lane primary gate). Linux test
  # coverage is NOT lost — every merge to main still runs this full job on the
  # existing [self-hosted, linux, x64] runners.
  server-tests:
    name: Server unit tests
    if: github.event_name == 'push'
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build shared
        run: npx nx build twenty-shared

      - name: Run server tests
        # Fail closed: a non-zero exit from the test run must fail the job so
        # release green-CI gates cannot pass while server tests fail.
        #
        # Root cause of the previous (removed) `continue-on-error: true`:
        # jest.config.mjs enforced global coverage thresholds (30/20/25/30) and
        # the codebase currently sits below them (~27% statements). jest then
        # exited non-zero *even when every test passed*, so CI swallowed the
        # exit code — which ALSO masked genuine test failures. Coverage
        # enforcement is now opt-in (JEST_ENFORCE_COVERAGE, see jest.config.mjs),
        # so this step's exit code reflects test pass/fail only: a failing test
        # (and only a failing test) fails the job.
        # `^build` (nx targetDefaults) builds workspace deps (twenty-emails /
        # twenty-client-sdk) first so they resolve in the jest module context;
        # `--configuration=ci` pins maxWorkers=1 for deterministic runs.
        run: npx nx test twenty-server --configuration=ci -- --passWithNoTests

  # PR LANE (primary test gate) — runs the server unit test suite, scoped to the
  # tests affected by the PR's diff (see "Select test scope" below; a change
  # outside jest's module graph still runs everything), on the
  # dedicated self-hosted macOS runner (mac-m4-exe-crm, M4 / 16 cores). Check
  # context: "Server unit tests (mac)". Runs ONLY on pull_request + merge_group
  # (merge queue requires protection-required contexts to report on merge_group
  # or the queue stalls).
  #
  # Why: the Linux build-my runners share one overloaded host — the full yarn
  # workspace install + jest run took 30+ min there and queued behind other
  # jobs. The mac runner is a dedicated 16-core box.
  #
  # `--maxWorkers=6` overrides the `--configuration=ci` pin of maxWorkers=1
  # (nx CLI args take precedence over configuration values). maxWorkers=1 on
  # Linux exists to avoid core thrash on the SHARED build-my host; the mac
  # runner runs only this job, so 6 workers on 16 cores is safe headroom while
  # leaving cores for the dev box's own load.
  #
  # macOS notes: no Docker on this runner (docker-dependent jobs stay on
  # Linux — see security-scan); setup-node cache keys include runner OS+arch,
  # so the macOS-arm64 yarn cache never collides with the Linux-x64 one.
  server-tests-mac:
    name: Server unit tests (mac)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON('["self-hosted", "macOS", "ARM64", "mac-fast"]') }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Affected-only test selection (see "Select test scope" below) needs
          # real history to compute a merge base with main. The default shallow
          # clone has none.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        # @recallai/desktop-sdk (a twenty-companion desktop-only dep) runs a
        # darwin-only postinstall that downloads a ~48MB native SDK tar from
        # us-east-1 S3 with no retry. From this runner that download flakes with
        # ECONNRESET and fails `yarn install --immutable`, breaking this required
        # "Server unit tests (mac)" gate — even though the server suite never
        # uses the desktop SDK. On Linux the same postinstall is a no-op (it only
        # downloads on darwin/win32), which is why the Linux lane is unaffected.
        # RECALL_LOCAL_BUILD makes setup.js skip the native download entirely.
        # (bug 19fcc1f0)
        env:
          RECALL_LOCAL_BUILD: '1'
        run: yarn install --immutable

      - name: Build shared
        run: npx nx build twenty-shared

      # AFFECTED-ONLY SELECTION — PR LANE ONLY.
      #
      # Decides between the full suite and jest's `--changedSince` for THIS job.
      # The main-push lane (`server-tests` above) always runs the full suite and
      # is deliberately untouched: affected-only is a PR-feedback optimisation,
      # never the record of what main has been proven against.
      #
      # NOTE: the CI audit described a `test:changed` / `test:coverage:changed`
      # pair of `vitest --changed origin/main` scripts already sitting unused in
      # package.json. They do not exist in this repo — no package.json in the
      # workspace defines them, `git log -S"test:changed" --all` finds nothing,
      # and twenty-server's suite is jest (packages/twenty-server/jest.config.mjs),
      # not vitest. `--changedSince` below is jest's equivalent of that flag.
      #
      # FAIL-SAFE: anything whose blast radius jest CANNOT see through its module
      # graph forces the FULL suite. jest resolves related tests by import graph,
      # and these are exactly the changes that do not show up there:
      #   - yarn.lock / any package.json — dependency version changes
      #   - any tsconfig*.json, nx.json, .nvmrc — compiler/runner config
      #   - jest.config.mjs / setupTests.ts / twenty-server project.json — the
      #     harness itself
      #   - packages/twenty-shared|twenty-emails|twenty-client-sdk — workspace
      #     deps the server imports as BUILT packages via node_modules, so a
      #     source change there is invisible to jest's graph
      #   - this workflow file
      # Everything else (server src/ and test/) is genuinely covered by jest's
      # own dependency resolution.
      - name: Select test scope
        id: scope
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          set -euo pipefail

          # fetch-depth: 0 gives full history but not necessarily a
          # remote-tracking ref for the base branch. Create it explicitly.
          git fetch --no-tags --force origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"

          MERGE_BASE=$(git merge-base "refs/remotes/origin/${BASE_REF}" HEAD)
          echo "merge base with ${BASE_REF}: ${MERGE_BASE}"

          CHANGED=$(git diff --name-only "${MERGE_BASE}" HEAD)
          echo "changed files:"
          echo "${CHANGED}" | awk '{ print "    " $0 }'

          FULL_RE='^(yarn\.lock|nx\.json|\.nvmrc|\.github/workflows/ci\.yml)$'
          FULL_RE="${FULL_RE}"'|(^|/)package\.json$|(^|/)tsconfig[^/]*\.json$'
          FULL_RE="${FULL_RE}"'|^packages/twenty-server/(jest\.config\.mjs|setupTests\.ts|project\.json)$'
          FULL_RE="${FULL_RE}"'|^packages/(twenty-shared|twenty-emails|twenty-client-sdk)/'

          if [ -z "${CHANGED}" ] || echo "${CHANGED}" | grep -qE "${FULL_RE}"; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::notice::Running the FULL server suite (a change outside jest's module graph was detected, or no diff was resolvable)."
          else
            echo "scope=changed" >> "$GITHUB_OUTPUT"
            echo "merge_base=${MERGE_BASE}" >> "$GITHUB_OUTPUT"
            echo "::notice::Running only tests related to files changed since ${MERGE_BASE}."
          fi

      - name: Run server tests (affected only)
        if: steps.scope.outputs.scope == 'changed'
        # Same fail-closed semantics as the main-lane `server-tests` job (see its
        # comment for the coverage-threshold / continue-on-error history) — the
        # ONLY difference from the full command below is `--changedSince`, which
        # narrows jest to the specs that transitively import a changed file.
        run: npx nx test twenty-server --configuration=ci --maxWorkers=6 -- --passWithNoTests --changedSince=${{ steps.scope.outputs.merge_base }}

      - name: Run server tests (full suite)
        if: steps.scope.outputs.scope == 'full'
        # KEEP IN SYNC with the main-lane `server-tests` command apart from
        # --maxWorkers.
        run: npx nx test twenty-server --configuration=ci --maxWorkers=6 -- --passWithNoTests

  security-scan:
    name: Security scan (secrets, deps, container config)
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    # Same slot-wait-inside-the-budget problem as brand-drift above, just less
    # obvious because this job does real work. Measured on PR #99: 8m20s in
    # ci-slot-acquire ("Set up runner") + 8m34s in `yarn install --immutable`
    # = 16m54s of a 20m budget consumed BEFORE the first scanner starts, so
    # gitleaks was cancelled mid-run and every later scan step was skipped.
    # The scanners need ~5m; the fixed overhead is what grew.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      # Secret scan (open-source gitleaks binary via its pinned-by-digest image;
      # the gitleaks GitHub Action requires a paid license for org repos, the CLI
      # does not). --no-git scans the current checkout. Fails closed on findings.
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source=/repo --no-git --redact --no-banner --verbose \
            --config=/repo/.gitleaks.toml

      # Production dependency vulnerability scan. The required gate audits only
      # production dependencies at CRITICAL severity; dev-dependency and HIGH
      # advisory signals are surfaced by the non-blocking informational step below.
      #
      # The gate's VERDICT comes from the committed .audit-baseline.json, not
      # straight from the live feed (bug 4395cda9). Running the live audit
      # fail-closed coupled merge eligibility to an external feed that changes
      # continuously: a green PR went red hours later, with zero code change,
      # because a CVE was published in a transitive dependency. Worse, it was
      # self-trapping -- the PR that would clear the audit needed its own green
      # audit to merge (bug eb6697d9, two-week stall).
      #
      # The severity bar and production-only scope are UNCHANGED. What changed
      # is who gets interrupted: an advisory absent from the baseline does not
      # block a commit that predates it, while an acknowledgement whose deadline
      # has lapsed does block. New CRITICALs still print on every run.
      - name: Dependency scan (deterministic gate vs committed baseline)
        run: |
          set -uo pipefail

          # `yarn npm audit` exits non-zero WHENEVER it finds advisories, so its
          # status cannot be the verdict -- capture it and let the gate decide.
          # It is passed through to the gate so that "exited 0 and printed
          # nothing" (a genuinely clean tree) is distinguishable from "crashed
          # and printed nothing", which must still fail closed.
          yarn npm audit --recursive --environment production \
            --severity critical --json > audit-critical.json
          audit_rc=$?
          echo "yarn npm audit exited ${audit_rc}"

          python3 .github/scripts/audit-gate.py --self-test
          python3 .github/scripts/audit-gate.py \
            --audit-json audit-critical.json \
            --baseline .audit-baseline.json \
            --audit-exit-code "${audit_rc}"

      - name: Dependency scan (yarn npm audit, production, latest high advisory signal)
        run: yarn npm audit --all --recursive --environment production --severity high
        continue-on-error: true

      # Container / IaC misconfiguration scan of the production Docker stack
      # (Dockerfile + docker-compose) AND the helm/ + k8s/ orchestration
      # manifests (hardened in bug be6e91fe — securityContext, non-root,
      # read-only rootfs, cap drops). Complements the full image vulnerability
      # scan run at release time (.github/workflows/release-stack-image.yml).
      # Fails closed on HIGH+.
      - name: Container config scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: packages/twenty-docker
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
