name: Release stack image

on:
  push:
    tags:
      - 'v*.*.*'
      - 'stack-v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Fail-closed gate: never build/push a release image unless the exact commit
  # the tag points at has a GREEN CI run. Polls the CI workflow for this SHA and
  # fails closed on failure, on a non-success conclusion, or on timeout.
  # ---------------------------------------------------------------------------
  require-green-ci:
    name: Require green CI for commit
    # Bug e3b77fc8: this waiter must never be able to starve the CI run it
    # polls. It is a pure api.github.com poll — no checkout, no Docker, no
    # secrets, only ${{ github.token }}. It used to dodge starvation on
    # GitHub-hosted ubuntu-latest; that lane is banned by founder directive
    # 2026-09-02, so it shares a local lane with CI. Two properties make that
    # safe here:
    #   - The Linux x64 pool has TWO runners (mac-vm-crm-1 + build-my-crm-1
    #     until it is retired). A waiter can hold at most one of them, so a CI
    #     run always has another slot to land on — no circular wait, unlike a
    #     single-runner lane where the waiter holding THE runner deadlocks the
    #     CI run it polls for.
    #   - The waiter is queued BEHIND pending CI jobs, never ahead of an
    #     already-running one: it is only scheduled once a runner is idle, so
    #     it cannot preempt work in flight.
    # The 30-minute poll ceiling below is the hard backstop: even a pathologi-
    # cal queue can only cost one timed-out release, never a stuck runner.
    runs-on: [self-hosted, linux]
    steps:
      - name: Gate on green CI of exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          repo = os.environ["REPO"]; sha = os.environ["SHA"]; token = os.environ["GH_TOKEN"]
          api = (f"https://api.github.com/repos/{repo}/actions/workflows/ci.yml/runs"
                 f"?head_sha={sha}&per_page=100")

          def fetch():
              req = urllib.request.Request(api, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          # bug e3b77fc8: this gate USED to run on the same single self-hosted
          # runner as CI, so any wait here starved the very CI run it polls for.
          # The short 300s window was a mitigation for that. The waiter now
          # shares the 2-runner Linux pool with CI (see runs-on above): it can
          # hold at most one slot, CI always has the other, and the 30-minute
          # ceiling bounds any pathological queue — timing out at 5 minutes
          # just forces an operator re-dispatch for a run that was about to go
          # green anyway. Still overridable per-run.
          GRACE = int(os.environ.get('REQUIRE_GREEN_CI_GRACE_SECS', '1800'))
          deadline = time.time() + GRACE
          while True:
              runs = None
              try:
                  runs = fetch().get("workflow_runs", [])
              except (urllib.error.URLError, TimeoutError) as e:
                  print(f"::warning::CI status query failed ({e}); will retry")
              if runs is not None:
                  mine = [r for r in runs if r.get("head_sha") == sha]
                  if not mine:
                      print(f"No CI run found yet for {sha}; waiting...")
                  else:
                      latest = max(mine, key=lambda r: r.get("id", 0))
                      st, concl = latest.get("status"), latest.get("conclusion")
                      print(f"Latest CI run {latest.get('id')}: status={st} conclusion={concl}")
                      if st == "completed":
                          if concl == "success":
                              print(f"::notice::CI is green for {sha}. Proceeding with release.")
                              sys.exit(0)
                          print(f"::error::CI conclusion for {sha} is '{concl}' "
                                f"(not success). Refusing to release. Failing closed.")
                          sys.exit(1)
              if time.time() > deadline:
                  print(f"::error::CI for {sha} has not completed within the grace "
                        f"window. Failing closed WITHOUT releasing the runner further.")
                  print("::error::This gate no longer holds a self-hosted runner "
                        "(bug e3b77fc8), so it is not blocking CI itself — CI for this "
                        "commit either never started or is still queued behind other "
                        "work on the self-hosted pool. Remedy: let CI complete on this "
                        "commit, then re-dispatch this workflow "
                        "(gh run rerun <id> --failed, or re-push the tag).")
                  sys.exit(1)
              time.sleep(30)
          PY

  release-image:
    needs: require-green-ci
    runs-on: [self-hosted, linux, x64]
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate stack release contract
        id: release
        shell: bash
        run: |
          python -m json.tool stack.release.json >/dev/null
          python - <<'PY2' >> "$GITHUB_OUTPUT"
          import json, re
          rel = json.load(open('stack.release.json'))
          assert rel.get('schemaVersion') == 1, 'schemaVersion must be 1'
          assert rel.get('version'), 'version required'
          assert rel.get('image', '').endswith(':v' + rel['version']), 'image must use stack release tag'
          # Bug cc8feeee: imageDigest is NO LONGER a release INPUT. A new build's
          # digest cannot be known before the build, and recording it changes the
          # commit sha that gets stamped into the image config — which changes the
          # digest. Demanding it up front was unsatisfiable by construction. The
          # digest is now an OUTPUT of this workflow, consumed by the exe-os stack
          # manifest (stack-release.ts already pins from it). Any value here is a
          # historical record only and is deliberately NOT gated on.
          assert rel.get('stackParticipation', {}).get('health'), 'health checks required'
          assert rel.get('stackParticipation', {}).get('smokeTests'), 'smoke tests required'
          print('stack_version=' + rel['version'])
          print('image=' + rel['image'])
          PY2

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GHCR_TOKEN }}

      # The build below pins platforms: linux/amd64, so its RUN steps (yarn
      # install, the twenty build) may execute cross-arch on an arm64 host —
      # the x64 lane now runs on mac-vm-crm-1 in the ci-linux VM. Binfmt MUST
      # be guaranteed by the workflow, not inherited from the host: an
      # unconfigured host would fail mid-RUN before any verification gate
      # could fire. Same fix as AskExe/exe-os#1026.
      - name: Set up QEMU (amd64 binfmt for cross-arch builds)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Chain-of-custody G1 (bug f78db968): compute the stamp facts. tree_clean
      # is MEASURED, not asserted — a hardcoded "true" would make the label
      # worthless. Mirrors exe-os scripts/bake-version.sh semantics so the
      # exe-os G2/G4/G6 gates read identical values across repos.
      #
      # DETERMINISM (bug f78db968): every fact stamped into the image CONFIG must
      # be a pure function of the git_sha, or the config digest — and thus the
      # manifest digest the fail-closed digest-verify gate compares — changes on
      # every build and the pin can never converge. A `date -u` build_time is the
      # one non-deterministic fact, so it is deliberately NOT stamped into the
      # config. It is unused: the exe-os provenance verifier reads only
      # org.exe.git_sha / org.exe.repo / org.exe.tree_clean, and build time is
      # recoverable from the git_sha's commit date. git_sha/repo/git_ref/tree_clean
      # are all deterministic for a fixed tagged commit and stay in the config.
      - name: Stamp facts (chain-of-custody G1)
        id: stamp
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
            tree_clean="false"
          else
            tree_clean="true"
          fi
          echo "tree_clean=$tree_clean" >> "$GITHUB_OUTPUT"
          echo "Stamping tree_clean=$tree_clean"

      - name: Build image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          # Explicit, not inherited: the x64 lane now runs on the ARM64 ci-linux
          # VM (mac-vm-crm-1). Without this pin a lane swap would silently
          # produce a linux/arm64 image for an amd64 customer fleet.
          platforms: linux/amd64
          push: true
          # PUSH-BEFORE-VERIFY ORDERING (bug cc8feeee). build-push must push to
          # produce a digest, so *something* becomes resolvable before any gate
          # runs. We therefore publish ONLY the immutable, self-describing
          # sha-<commit> tag here. The human-facing RELEASE tag is created later,
          # after provenance verification AND the vulnerability scan both pass, so
          # a red run can never leave a release tag pointing at an unverified or
          # vulnerable artifact. That is what previously made a failed run look
          # like "the release failed, I'll push it by hand".
          tags: |
            ghcr.io/askexe/exe-crm:sha-${{ github.sha }}
          # Bug f78db968: these labels are the ONLY way a deployed image can be
          # traced back to a release. The exe-crm image running in production
          # carries NO version label at all — it was hand-built and hand-pushed
          # while this pipeline was red, so this block never ran on it. The
          # org.exe.* labels are the chain-of-custody set the exe-os G2/G4/G6
          # gates verify.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.stack_version }}
            org.exe.git_sha=${{ github.sha }}
            org.exe.repo=${{ github.repository }}
            org.exe.git_ref=${{ github.ref_name }}
            org.exe.tree_clean=${{ steps.stamp.outputs.tree_clean }}

      # Fail-closed digest verification: the image actually published must match
      # the digest pinned in stack.release.json. On drift this fails with the
      # built digest so the maintainer can update stack.release.json and re-tag.
      #
      # REPLACED (bug cc8feeee). The old gate compared the built digest against a
      # digest pre-committed in stack.release.json, with this documented remedy:
      #   1) cut the tag — the run builds, pushes, then fails printing the digest;
      #   2) commit that digest to stack.release.json;
      #   3) move the tag to the new commit — "verification passes".
      # Step 3 cannot pass. Since #89 the build stamps the commit sha into the
      # image CONFIG (org.exe.git_sha, org.opencontainers.image.revision), so the
      # re-pin commit changes github.sha -> changes the labels -> changes the
      # config -> changes the digest. The remedy produces a DIFFERENT digest and
      # drift-fails again, forever. A digest is an OUTPUT of a build; it cannot be
      # an INPUT to the build that produces it.
      #
      # What we verify instead (exe-os chain-of-custody G2, ported): the image we
      # actually pushed provably came from this commit. That is the real invariant
      # — "an image whose contents do not originate from the tag it wears must
      # never be published" — and it is satisfiable in ONE pass.
      #
      # Labels are read off the IMMUTABLE DIGEST, never the mutable tag, so a
      # concurrent push cannot swap the artifact under the gate. A multi-arch
      # manifest INDEX is resolved to its linux/amd64 child before reading
      # .Config.Labels; reading labels off an index yields none and would
      # false-negative (exe-os bug e98a77d8).
      #
      # FAIL-CLOSED on: missing/mismatched org.exe.git_sha, missing/mismatched
      # org.exe.repo, tree_clean != true, or the release tag resolving to a digest
      # other than the one built. Negative tests: `verify-image-provenance.py
      # --self-test` (10 cases, run in CI below).
      - name: Chain-of-custody self-tests (negative cases)
        shell: bash
        run: python3 .github/scripts/verify-image-provenance.py --self-test
          --image-tag x --built-digest x --expected-sha x --expected-repo x

      - name: Verify build provenance of the pushed image (G2, fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-image-provenance.py \
            --image-tag "ghcr.io/askexe/exe-crm:sha-${{ github.sha }}" \
            --built-digest "${{ steps.build.outputs.digest }}" \
            --expected-sha "${{ github.sha }}" \
            --expected-repo "${{ github.repository }}"

      # Container/image vulnerability scan of the EXACT image we just pushed
      # (referenced by its immutable build digest). Fails closed on HIGH/CRITICAL.
      #
      # ORDERING (bug f78db968, refined by cc8feeee): this runs AFTER provenance
      # verification and BEFORE the release tag is published. build-push-action
      # has already pushed by the time any scan can reference the image, so a scan
      # failure still leaves a PUSHED, correctly labelled artifact behind a RED
      # run — but it is now reachable only as sha-<commit>, never as the release
      # tag. Reading a red run as "the release failed, I'll build and push it by
      # hand" is exactly what put an unlabelled image into production; verifying
      # provenance first records the run's most important guarantee even when the
      # scan then fails, and withholding the release tag means the unscanned
      # artifact cannot be mistaken for a release.
      - name: Scan published image (Trivy)
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/askexe/exe-crm@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          # Time-boxed exceptions ONLY, each with an `expired_at` (see the file).
          # Passed explicitly rather than relying on auto-discovery so that a
          # rename or a move makes this step fail loudly instead of silently
          # scanning with no allowlist — or, worse, silently honouring one
          # nobody declared.
          trivyignores: .trivyignore.yaml

      # The scan gate is the step that most often reddens this pipeline (the
      # 2026-08-06 and v0.9.54 runs both died here on fixable Go stdlib CVEs
      # inherited from the base image). Make the correct remedy unmissable so
      # nobody "fixes" it by hand-pushing again.
      - name: Explain a scan failure
        if: failure() && steps.scan.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::Trivy found CRITICAL/HIGH fixable vulnerabilities."
          echo "::error::The image at ghcr.io/askexe/exe-crm@${{ steps.build.outputs.digest }} IS ALREADY PUSHED"
          echo "::error::and IS correctly labelled — this run is red because of the scan, not the build."
          echo "::error::"
          echo "::error::REMEDY: bump the base image so the fixable CVEs drop out, then re-run."
          echo "::error::NEVER hand-build and hand-push a replacement: a hand-built image carries no"
          echo "::error::org.opencontainers.image.version and no org.exe.* labels, and update.askexe.com"
          echo "::error::is read-only (AskExe/exe-os#592) so such a push cannot reach production anyway."
          echo "::error::"
          echo "::error::NOTE (bug cc8feeee): no RELEASE tag was created by this run. Only the"
          echo "::error::immutable ghcr.io/askexe/exe-crm:sha-${{ github.sha }} tag exists, so nothing"
          echo "::error::downstream can resolve this unverified artifact as a release."

      # Publish the human-facing RELEASE tag ONLY once provenance AND the scan
      # have both passed (bug cc8feeee). Until this step runs, the artifact is
      # reachable only by its sha-<commit> tag / digest, so a red run cannot leave
      # a release tag pointing at an unverified or vulnerable image.
      #
      # imagetools create re-points a tag at an EXISTING manifest — it does not
      # rebuild, so the digest cannot change here.
      - name: Publish release tag (verified artifacts only)
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          BUILT: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # TAG-REUSE GUARD (bug 2fe79166). Never move an existing release tag onto
          # different bytes: exe-erp's v0.2.0-final8 was overwritten across three
          # distinct builds, which makes tag references irreproducible and rollback
          # targets meaningless. If this tag already exists and points somewhere
          # else, fail closed — cut a new version instead.
          if EXISTING=$(docker buildx imagetools inspect "${IMAGE}" 2>/dev/null \
                        | awk '/^Digest:/{print $2; exit}'); then
            if [ -n "${EXISTING:-}" ] && [ "${EXISTING}" != "${BUILT}" ]; then
              echo "::error::Release tag ${IMAGE} already exists and resolves to ${EXISTING},"
              echo "::error::but this run built ${BUILT}. Refusing to overwrite a published"
              echo "::error::release tag with different bytes (bug 2fe79166) — bump the version."
              exit 1
            fi
            echo "Release tag already resolves to ${BUILT} — idempotent re-run, nothing to move."
          fi
          docker buildx imagetools create \
            --tag "${IMAGE}" \
            "ghcr.io/askexe/exe-crm@${BUILT}"
          # Re-assert after publishing: the release tag must resolve to exactly the
          # digest we verified. Catches a concurrent push racing this step.
          python3 .github/scripts/verify-image-provenance.py \
            --image-tag "${IMAGE}" \
            --built-digest "${BUILT}" \
            --expected-sha "${{ github.sha }}" \
            --expected-repo "${{ github.repository }}"

      - name: Report published digest (stack manifest input)
        shell: bash
        run: |
          {
            echo "## Stack image published"
            echo ""
            echo "| field | value |"
            echo "|-------|-------|"
            echo "| release tag | \`${{ steps.release.outputs.image }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| pinned ref | \`ghcr.io/askexe/exe-crm@${{ steps.build.outputs.digest }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo ""
            echo "Pin the **digest** above in the exe-os stack manifest. The digest is an"
            echo "OUTPUT of this release (bug cc8feeee) — do not pre-commit it here."
          } >> "$GITHUB_STEP_SUMMARY"
