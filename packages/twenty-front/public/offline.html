<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F0E1A" />
  <title>Exe CRM — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0F0E1A;
      color: #F0EDE8;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      opacity: 0.6;
    }
    h1 {
      font-family: 'Epilogue', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    p {
      color: #A09CAF;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    button {
      background: #F5D76E;
      color: #0F0E1A;
      border: none;
      border-radius: 8px;
      font-family: 'Epilogue', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 12px 32px;
      min-height: 44px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #E5C75E; }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#A09CAF" stroke-width="1.5">
      <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.56 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>You're Offline</h1>
    <p>Check your internet connection and try again. Your data is safe — we'll sync when you're back online.</p>
    <button onclick="window.location.reload()">TRY AGAIN</button>
  </div>
</body>
</html>
