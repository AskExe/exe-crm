<!doctype html>
<html lang="en" translate="no" class="dark">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/icons/exe-crm/favicon-32.png"
      data-rh="true"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/icons/exe-crm/favicon-16.png"
    />
    <link rel="apple-touch-icon" href="/images/icons/exe-crm/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#0F0E1A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Exe CRM" />
    <meta property="og:description" content="Exe CRM" />
    <meta property="og:title" content="Exe CRM" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Exe CRM" />
    <meta name="twitter:title" content="Exe CRM" />
    <style>
      @font-face {
        font-family: 'Epilogue';
        src: url('/fonts/Epilogue-Variable.woff2') format('woff2');
        font-weight: 400 900;
        font-display: block;
      }
      @font-face {
        font-family: 'Manrope';
        src: url('/fonts/Manrope-Variable.woff2') format('woff2');
        font-weight: 400 700;
        font-display: block;
      }
      @font-face {
        font-family: 'Space Grotesk';
        src: url('/fonts/SpaceGrotesk-Variable.woff2') format('woff2');
        font-weight: 400 700;
        font-display: block;
      }

      /* Exe Foundry Bold — brand rule #3: display headlines */
      h1, h2, .display-heading {
        text-transform: uppercase;
        letter-spacing: -0.02em;
      }
    </style>

    <title>Exe CRM</title>
    <!-- BEGIN: Branding -->
    <!-- Overwritten at runtime by generate-front-config.ts -->
    <!-- END: Branding -->
    <!-- BEGIN: Exe CRM Config -->
    <script id="exe-crm-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: Exe CRM Config -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      /* Exe Foundry Bold — always dark. No light theme flash. */
      html, body {
        background-color: #0F0E1A !important;
        color: #F0EDE8 !important;
        margin: 0;
        padding: 0;
      }
      /* Pre-React loading state — visible on first paint while JS parses.
         Fixes mobile Safari black screen on initial load (bug 3526a764).
         React.createRoot replaces #root children, removing the spinner. */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
      }
      #root:empty::after {
        content: '';
        width: 28px;
        height: 28px;
        border: 2.5px solid rgba(245, 215, 110, 0.15);
        border-top-color: #F5D76E;
        border-radius: 50%;
        animation: exe-spin 0.7s linear infinite;
      }
      @keyframes exe-spin {
        to { transform: rotate(360deg); }
      }
      /* Kill any stray borders/lines from Twenty's default light theme */
      *, *::before, *::after {
        border-color: rgba(240, 237, 232, 0.1) !important;
      }
    </style>
  </head>
  <body style="background-color: #0F0E1A;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" style="
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    "></div>
    <script type="module" src="/src/index.tsx"></script>
    <script>
      // Register service worker for PWA offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Trim caches periodically (every 30 min)
            setInterval(() => {
              reg.active?.postMessage({ type: 'TRIM_CACHES' });
            }, 30 * 60 * 1000);
          }).catch((err) => {
            console.warn('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
