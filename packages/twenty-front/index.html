<!doctype html>
<html lang="en" translate="no" class="light">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/icons/exe-crm/favicon-32.png"
      data-rh="true"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/icons/exe-crm/favicon-16.png"
    />
    <link rel="apple-touch-icon" href="/images/icons/exe-crm/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#0F0E1A" />
    <meta name="description" content="Exe CRM" />
    <meta property="og:description" content="Exe CRM" />
    <meta property="og:title" content="Exe CRM" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Exe CRM" />
    <meta name="twitter:title" content="Exe CRM" />
    <style>
      @font-face {
        font-family: 'Epilogue';
        src: url('/fonts/Epilogue-Variable.woff2') format('woff2');
        font-weight: 400 900;
        font-display: swap;
      }
      @font-face {
        font-family: 'Manrope';
        src: url('/fonts/Manrope-Variable.woff2') format('woff2');
        font-weight: 400 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'Space Grotesk';
        src: url('/fonts/SpaceGrotesk-Variable.woff2') format('woff2');
        font-weight: 400 700;
        font-display: swap;
      }
    </style>

    <title>Exe CRM</title>
    <!-- BEGIN: Exe CRM Config -->
    <script id="twenty-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: Exe CRM Config -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      :root {
        /* THEME_DARK.background.tertiary */
        --theme-dark-background-tertiary: #1d1d1d;
        /* THEME_LIGHT.background.tertiary */
        --theme-light-background-tertiary: #f1f1f1;
      }

      @media (prefers-color-scheme: dark) {
        html, body {
          background-color: var(--theme-dark-background-tertiary);
        }
      }

      @media (prefers-color-scheme: light) {
        html, body {
          background-color: var(--theme-light-background-tertiary);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
