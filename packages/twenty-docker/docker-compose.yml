name: exe-crm

services:
  server:
    image: ghcr.io/askexe/exe-crm:${CRM_IMAGE_TAG:-v0.9.51}
    # Hardening: the server runs as uid 1000 and needs no Linux capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    ports:
      - '127.0.0.1:${CRM_HOST_PORT:-3000}:3000'
    environment:
      NODE_PORT: '3000'
      PG_DATABASE_URL: ${PG_DATABASE_URL:-postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:?Set PG_DATABASE_PASSWORD}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}}
      SERVER_URL: '${SERVER_URL:?SERVER_URL is required - set to your externally-reachable origin e.g. https://crm.example.com}'
      FRONTEND_URL: '${FRONTEND_URL:-${SERVER_URL}}'
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379}
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS:-}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION:-}

      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      STORAGE_S3_PRESIGNED_URL_ENABLED: ${STORAGE_S3_PRESIGNED_URL_ENABLED:-}
      STORAGE_S3_PRESIGNED_URL_BASE: ${STORAGE_S3_PRESIGNED_URL_BASE:-}

      GOTRUE_URL: ${GOTRUE_URL:-}
      GOTRUE_JWT_ISSUER: ${GOTRUE_JWT_ISSUER:-}
      GOTRUE_JWT_AUDIENCE: ${GOTRUE_JWT_AUDIENCE:-}
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:-}

      APP_SECRET: '${APP_SECRET:?APP_SECRET is required - generate with openssl rand -base64 32}'
      EXE_LICENSE_KEY: '${EXE_LICENSE_KEY:?EXE_LICENSE_KEY is required - purchase at https://askexe.com}'
      EXE_CRM_ADMIN_TOKEN: ${EXE_CRM_ADMIN_TOKEN:-}
      # Trusted-proxy configuration for abuse accounting (bug 29837293). See
      # .env.example — getting these wrong degrades rate limiting, it never
      # blocks legitimate traffic.
      EXE_TRUSTED_PROXY_HOPS: ${EXE_TRUSTED_PROXY_HOPS:-}
      EXE_TRUST_CLOUDFLARE_IP: ${EXE_TRUST_CLOUDFLARE_IP:-}
      # Google auth — set values in .env to enable
      MESSAGING_PROVIDER_GMAIL_ENABLED: ${MESSAGING_PROVIDER_GMAIL_ENABLED:-}
      CALENDAR_PROVIDER_GOOGLE_ENABLED: ${CALENDAR_PROVIDER_GOOGLE_ENABLED:-}
      AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GOOGLE_CALLBACK_URL: ${AUTH_GOOGLE_CALLBACK_URL:-}
      AUTH_GOOGLE_APIS_CALLBACK_URL: ${AUTH_GOOGLE_APIS_CALLBACK_URL:-}

      # Microsoft auth — set values in .env to enable
      CALENDAR_PROVIDER_MICROSOFT_ENABLED: ${CALENDAR_PROVIDER_MICROSOFT_ENABLED:-}
      MESSAGING_PROVIDER_MICROSOFT_ENABLED: ${MESSAGING_PROVIDER_MICROSOFT_ENABLED:-}
      AUTH_MICROSOFT_ENABLED: ${AUTH_MICROSOFT_ENABLED:-}
      AUTH_MICROSOFT_CLIENT_ID: ${AUTH_MICROSOFT_CLIENT_ID:-}
      AUTH_MICROSOFT_CLIENT_SECRET: ${AUTH_MICROSOFT_CLIENT_SECRET:-}
      AUTH_MICROSOFT_CALLBACK_URL: ${AUTH_MICROSOFT_CALLBACK_URL:-}
      AUTH_MICROSOFT_APIS_CALLBACK_URL: ${AUTH_MICROSOFT_APIS_CALLBACK_URL:-}

      # Email — set values in .env to enable
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}

    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    image: ghcr.io/askexe/exe-crm:${CRM_IMAGE_TAG:-v0.9.51}
    # Hardening: the worker runs as uid 1000 and needs no Linux capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ['yarn', 'worker:prod']
    environment:
      PG_DATABASE_URL: ${PG_DATABASE_URL:-postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:?Set PG_DATABASE_PASSWORD}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}}
      SERVER_URL: '${SERVER_URL:?SERVER_URL is required - set to your externally-reachable origin e.g. https://crm.example.com}'
      FRONTEND_URL: '${FRONTEND_URL:-${SERVER_URL}}'
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379}
      DISABLE_DB_MIGRATIONS: 'true' # it already runs on the server
      DISABLE_CRON_JOBS_REGISTRATION: 'true' # it already runs on the server

      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      STORAGE_S3_PRESIGNED_URL_ENABLED: ${STORAGE_S3_PRESIGNED_URL_ENABLED:-}
      STORAGE_S3_PRESIGNED_URL_BASE: ${STORAGE_S3_PRESIGNED_URL_BASE:-}

      GOTRUE_URL: ${GOTRUE_URL:-}
      GOTRUE_JWT_ISSUER: ${GOTRUE_JWT_ISSUER:-}
      GOTRUE_JWT_AUDIENCE: ${GOTRUE_JWT_AUDIENCE:-}
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:-}

      APP_SECRET: '${APP_SECRET:?APP_SECRET is required - generate with openssl rand -base64 32}'
      EXE_LICENSE_KEY: '${EXE_LICENSE_KEY:?EXE_LICENSE_KEY is required - purchase at https://askexe.com}'

      # Google auth — set values in .env to enable
      MESSAGING_PROVIDER_GMAIL_ENABLED: ${MESSAGING_PROVIDER_GMAIL_ENABLED:-}
      CALENDAR_PROVIDER_GOOGLE_ENABLED: ${CALENDAR_PROVIDER_GOOGLE_ENABLED:-}
      AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GOOGLE_CALLBACK_URL: ${AUTH_GOOGLE_CALLBACK_URL:-}
      AUTH_GOOGLE_APIS_CALLBACK_URL: ${AUTH_GOOGLE_APIS_CALLBACK_URL:-}

      # Microsoft auth — set values in .env to enable
      CALENDAR_PROVIDER_MICROSOFT_ENABLED: ${CALENDAR_PROVIDER_MICROSOFT_ENABLED:-}
      MESSAGING_PROVIDER_MICROSOFT_ENABLED: ${MESSAGING_PROVIDER_MICROSOFT_ENABLED:-}
      AUTH_MICROSOFT_ENABLED: ${AUTH_MICROSOFT_ENABLED:-}
      AUTH_MICROSOFT_CLIENT_ID: ${AUTH_MICROSOFT_CLIENT_ID:-}
      AUTH_MICROSOFT_CLIENT_SECRET: ${AUTH_MICROSOFT_CLIENT_SECRET:-}
      AUTH_MICROSOFT_CALLBACK_URL: ${AUTH_MICROSOFT_CALLBACK_URL:-}
      AUTH_MICROSOFT_APIS_CALLBACK_URL: ${AUTH_MICROSOFT_APIS_CALLBACK_URL:-}

      # Email — set values in .env to enable
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}

    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const net=require(''net''); const u=new URL(process.env.REDIS_QUEUE_URL || process.env.REDIS_URL || ''redis://redis:6379''); const s=net.createConnection({host:u.hostname, port:Number(u.port)||6379},()=>{s.end(); process.exit(0);}); s.setTimeout(3000,()=>{s.destroy(); process.exit(1);}); s.on(''error'',()=>process.exit(1));"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  db:
    # Digest-pinned for supply-chain integrity (re-audit blocker).
    image: postgres:16.9-alpine@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
    # Hardening: drop all caps, keep only the minimal set the official postgres
    # entrypoint needs to chown the data dir and drop root -> postgres via gosu.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?Set PG_DATABASE_PASSWORD}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    # Digest-pinned for supply-chain integrity (re-audit blocker).
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    # Hardening: drop all caps, keep only what the entrypoint needs to drop
    # root -> redis via su-exec.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    command: ['--maxmemory-policy', 'noeviction', '--requirepass', '${REDIS_PASSWORD:?Set REDIS_PASSWORD}']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:?Set REDIS_PASSWORD}', '--no-auth-warning', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  db-backup:
    # Digest-pinned for supply-chain integrity (re-audit blocker).
    image: postgres:16.9-alpine@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
    # Hardening: minimal caps needed for apk to install gnupg and for file ops.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        # Fail closed: encryption is mandatory. Refuse to run if no key is set,
        # so we never write unencrypted customer data to the backup volume.
        if [ -z "$${EXE_BACKUP_KEY}" ]; then
          echo "FATAL: EXE_BACKUP_KEY is not set. Refusing to run unencrypted database backups."
          echo "Generate one ('openssl rand -base64 32') and set EXE_BACKUP_KEY to enable encrypted backups."
          exit 1
        fi
        apk add --no-cache gnupg >/dev/null 2>&1
        echo "Starting encrypted backup cron (every 6 hours)..."
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
          DUMP=/backups/exe-crm_$${TIMESTAMP}.dump
          echo "[$${TIMESTAMP}] Running pg_dump..."
          if PGPASSWORD=$${POSTGRES_PASSWORD} pg_dump \
              -h db -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-default} \
              --format=custom --file="$${DUMP}"; then
            echo "[$${TIMESTAMP}] Encrypting backup with GPG (AES256)..."
            if gpg --batch --yes --symmetric --cipher-algo AES256 \
                --passphrase "$${EXE_BACKUP_KEY}" \
                --output "$${DUMP}.gpg" "$${DUMP}"; then
              rm -f "$${DUMP}"
              ls -t /backups/exe-crm_*.dump.gpg 2>/dev/null | tail -n +8 | xargs -r rm -f
              echo "[$${TIMESTAMP}] Backup complete. Next in 6h."
            else
              # Never retain an unencrypted dump if encryption fails.
              echo "[$${TIMESTAMP}] ERROR: GPG encryption failed — removing plaintext dump."
              rm -f "$${DUMP}"
            fi
          else
            echo "[$${TIMESTAMP}] ERROR: pg_dump failed — skipping this cycle."
            rm -f "$${DUMP}"
          fi
          sleep 21600
        done
    environment:
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?Set PG_DATABASE_PASSWORD}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      EXE_BACKUP_KEY: ${EXE_BACKUP_KEY:-}
    volumes:
      - db-backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'ls /backups > /dev/null']
      interval: 60s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
    restart: unless-stopped

volumes:
  db-data:
  db-backups:
  server-local-data:
