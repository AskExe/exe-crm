{{- if .Values.db.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "twenty.fullname" . }}-db
  namespace: {{ include "twenty.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "twenty.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "twenty.name" . }}
      app.kubernetes.io/component: db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "twenty.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: db
    spec:
      # Hardening (bug be6e91fe): spilo runs postgres as uid/gid 101/103 and
      # writes runtime config/sockets/logs outside pgdata — those paths get
      # writable emptyDir mounts under readOnlyRootFilesystem.
      securityContext:
{{- toYaml .Values.db.internal.securityContext | nindent 8 }}
      volumes:
        - name: postgres-home
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: var-log
          emptyDir: {}
        {{- if .Values.db.internal.persistence.enabled }}
        - name: db-data
          persistentVolumeClaim:
            claimName: {{ if .Values.db.internal.persistence.existingClaim }}{{ .Values.db.internal.persistence.existingClaim }}{{ else }}{{ include "twenty.fullname" . }}-db{{ end }}
        {{- end }}
      containers:
        - name: db
          image: {{ .Values.db.internal.image.repository }}:{{ .Values.db.internal.image.tag }}
          imagePullPolicy: {{ .Values.db.internal.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
{{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: PGUSER_SUPERUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "twenty.fullname" . }}-db-superuser
                  key: username
            - name: PGPASSWORD_SUPERUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "twenty.fullname" . }}-db-superuser
                  key: password
            - name: SPILO_PROVIDER
              value: {{ .Values.db.internal.env.SPILO_PROVIDER | quote }}
            - name: ALLOW_NOSSL
              value: {{ .Values.db.internal.env.ALLOW_NOSSL | quote }}
          ports:
            - containerPort: 5432
              name: tcp
              protocol: TCP
          resources:
            {{- toYaml .Values.db.internal.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-home
              mountPath: /home/postgres
            {{- if .Values.db.internal.persistence.enabled }}
            - name: db-data
              mountPath: /home/postgres/pgdata
            {{- end }}
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
            - name: var-log
              mountPath: /var/log
{{- end }}
