apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: twentycrm-worker
  name: twentycrm-worker
  namespace: twentycrm
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: twentycrm-worker
  template:
    metadata:
      labels:
        app: twentycrm-worker
    spec:
      # Hardening (bug be6e91fe): non-root, no privilege escalation, no caps,
      # read-only root filesystem with explicit writable scratch mounts.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: twentycrm
          image: ghcr.io/askexe/exe-crm:v0.9.51
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: SERVER_URL
              value: 'https://crm.example.com:443'
            - name: PG_DATABASE_URL
              value: 'postgres://postgres:postgres@twentycrm-db.twentycrm.svc.cluster.local/default'
            - name: DISABLE_DB_MIGRATIONS
              value: 'false' # it already runs on the server
            - name: STORAGE_TYPE
              value: 'local'
            - name: 'REDIS_URL'
              value: 'redis://twentycrm-redis.twentycrm.svc.cluster.local:6379'
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: tokens
                  key: accessToken
          command:
            - yarn
            - worker:prod
          volumeMounts:
            - mountPath: /tmp
              name: tmp
          resources:
            requests:
              memory: '1024Mi'
              cpu: '250m'
            limits:
              memory: '2048Mi'
              cpu: '1000m'
          stdin: true
          tty: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
