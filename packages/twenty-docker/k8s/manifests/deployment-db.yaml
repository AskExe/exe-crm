apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: twentycrm-db
  name: twentycrm-db
  namespace: twentycrm
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: twentycrm-db
  template:
    metadata:
      labels:
        app: twentycrm-db
    spec:
      # Hardening (bug be6e91fe): non-root (spilo postgres uid/gid 101/103),
      # no privilege escalation, no caps, read-only root filesystem. Spilo
      # writes runtime config/sockets/logs outside pgdata, so those paths get
      # writable emptyDir mounts.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 103
        fsGroup: 103
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: twentycrm-db-data
          persistentVolumeClaim:
            claimName: twentycrm-db-pvc
        - name: postgres-home
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: var-log
          emptyDir: {}
      containers:
        - name: twentycrm
          # Pinned by digest (bug a842d0b3). The previous value was the tag
          # `:16`, which HAS NEVER EXISTED in this repository -- the registry
          # returns 404 for it, and with imagePullPolicy: Always that made this
          # deployment unable to start at all. The repository publishes
          # `latest` and vX.Y.Z only; there is no bare-major scheme.
          # v0.43.5 is the newest published release and is byte-identical to
          # `latest` (same index digest). The digest suffix is what makes this
          # immutable: the tag is retained only so a human can read which
          # release it is. NOTE: this image ships PostgreSQL 15, not 16 -- the
          # old tag name was aspirational, never real.
          image: twentycrm/twenty-postgres-spilo:v0.43.5@sha256:2f78405a78beaa4fa6eb9a9ec53c37e67ea66eaacc48da1a782759d0585362bf
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PGUSER_SUPERUSER
              value: "postgres"
            - name: PGPASSWORD_SUPERUSER
              value: "postgres"
            - name: SPILO_PROVIDER
              value: "local"
            - name: ALLOW_NOSSL
              value: "true"
          ports:
            - containerPort: 5432
              name: tcp
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
          stdin: true
          tty: true
          volumeMounts:
            - mountPath: /home/postgres
              name: postgres-home
            - mountPath: /home/postgres/pgdata
              name: twentycrm-db-data
            - mountPath: /run
              name: run
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/log
              name: var-log
      dnsPolicy: ClusterFirst
      restartPolicy: Always
