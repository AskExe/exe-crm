apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: twentycrm-db
  name: twentycrm-db
  namespace: twentycrm
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: twentycrm-db
  template:
    metadata:
      labels:
        app: twentycrm-db
    spec:
      # Hardening (bug be6e91fe): non-root (spilo postgres uid/gid 101/103),
      # no privilege escalation, no caps, read-only root filesystem. Spilo
      # writes runtime config/sockets/logs outside pgdata, so those paths get
      # writable emptyDir mounts.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 103
        fsGroup: 103
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: twentycrm-db-data
          persistentVolumeClaim:
            claimName: twentycrm-db-pvc
        - name: postgres-home
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: var-log
          emptyDir: {}
      containers:
        - name: twentycrm
          image: twentycrm/twenty-postgres-spilo:16
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PGUSER_SUPERUSER
              value: "postgres"
            - name: PGPASSWORD_SUPERUSER
              value: "postgres"
            - name: SPILO_PROVIDER
              value: "local"
            - name: ALLOW_NOSSL
              value: "true"
          ports:
            - containerPort: 5432
              name: tcp
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
          stdin: true
          tty: true
          volumeMounts:
            - mountPath: /home/postgres
              name: postgres-home
            - mountPath: /home/postgres/pgdata
              name: twentycrm-db-data
            - mountPath: /run
              name: run
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/log
              name: var-log
      dnsPolicy: ClusterFirst
      restartPolicy: Always
